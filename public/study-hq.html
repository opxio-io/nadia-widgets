<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>University Study HQ</title><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#fff;font-family:'Satoshi',-apple-system,sans-serif}.wrap{padding:20px;--card:#222;--line:rgba(255,255,255,.07);--muted:rgba(255,255,255,.4);--sub:rgba(255,255,255,.28);--g:#C8FF00}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.eyebrow,.lbl{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}h1{font-size:22px;margin:2px 0;font-weight:900;letter-spacing:-.04em}.clock{text-align:right;font-size:10px;color:var(--sub)}.courses{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:10px}.course,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.course{padding:14px}.code{font-size:13px;font-weight:900}.name{font-size:10px;color:var(--muted);margin-top:3px;min-height:28px}.bar{height:4px;background:rgba(255,255,255,.06);border-radius:8px;margin-top:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--g)}.meta{font-size:10px;color:var(--sub);margin-top:5px}.grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.card{padding:14px 18px;min-height:175px}.card h2{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding-bottom:9px;border-bottom:1px solid var(--line)}.item{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}.item:last-child{border:0}.accent{color:var(--g)}.empty{font-size:11px;color:var(--sub);padding:12px 0}.wide{grid-column:span 2}@media(max-width:900px){.courses{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:10px}.courses{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.clock{display:none}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Fall 2026</div><h1>University Study HQ</h1><div id="sync" class="meta">Connecting to Notion…</div></div><div class="clock"><div id="date"></div><strong id="time"></strong></div></header><section class="courses" id="courses"></section><section class="grid"><article class="card wide"><h2>Today / Schedule</h2><div id="today"></div></article><article class="card"><h2>Upcoming Deadlines</h2><div id="deadlines"></div></article><article class="card"><h2>Coursework Queue</h2><div id="queue"></div></article><article class="card"><h2>Next 7 Days</h2><div id="week"></div></article><article class="card"><h2>Exam Countdown</h2><div id="exams"></div></article></section></main><script>const $=x=>document.getElementById(x),day=x=>new Date(x).toLocaleDateString('en-CA'),fmt=x=>new Date(x).toLocaleDateString('en-CA',{month:'short',day:'numeric'}),empty=t=>`<div class="empty">${t}</div>`,item=(a,b)=>`<div class="item">${a}<div class="meta">${b||''}</div></div>`;function clock(){let n=new Date;$('date').textContent=n.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});$('time').textContent=n.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,3e4);async function load(){try{let r=await fetch('/api/study-hq',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);let map=Object.fromEntries(d.courses.map(c=>[c.id,c])),cn=ids=>ids.map(id=>map[id]?.code).filter(Boolean).join(', '),now=new Date,today=day(now),end=new Date(now);end.setDate(end.getDate()+7);$('courses').innerHTML=d.courses.filter(c=>c.status!=='Completed').slice(0,5).map(c=>{let progress=typeof c.assignmentProgress==='number'?c.assignmentProgress*100:0;return `<div class="course"><div class="code">${c.code||'Course'}</div><div class="name">${c.subject||c.category||''}</div><div class="bar"><span style="width:${Math.max(4,Math.min(100,progress))}%"></span></div><div class="meta">${c.status||'Planned'}${c.credits!=null?' · '+c.credits+' cr':''}</div></div>`}).join('')||empty('Add Fall 2026 courses.');let todays=d.classes.filter(x=>(x.date&&day(x.date)===today)||(!x.date&&x.days.includes(now.toLocaleDateString('en-CA',{weekday:'long'}))));$('today').innerHTML=todays.map(x=>item(x.name||cn(x.course)||'Class',`${x.time||''}${x.type?' · '+x.type:''}${x.room?' · '+x.room:''}${x.campus?' · '+x.campus:''}`)).join('')||empty('No classes scheduled today.');let open=d.coursework.filter(x=>x.status!=='Complete').sort((a,b)=>new Date(a.due||'2999')-new Date(b.due||'2999'));$('deadlines').innerHTML=open.filter(x=>x.due).slice(0,6).map(x=>item(x.title,`${cn(x.course)} · ${fmt(x.due)} · ${x.type||'Coursework'}`)).join('')||empty('No upcoming deadlines.');$('queue').innerHTML=open.slice(0,6).map(x=>item(x.title,`${cn(x.course)} · ${x.status||'Not started'}`)).join('')||empty('Coursework queue is clear.');$('week').innerHTML=d.classes.filter(x=>x.date&&new Date(x.date)>=now&&new Date(x.date)<=end).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,7).map(x=>item(x.name||cn(x.course),`${fmt(x.date)}${x.time?' · '+x.time:''} · ${x.type||''}`)).join('')||empty('No dated classes in the next 7 days.');let exams=open.filter(x=>/exam|quiz/i.test(x.type)&&x.due);$('exams').innerHTML=exams.slice(0,5).map(x=>{let n=Math.ceil((new Date(x.due)-now)/864e5);return item(x.title,`${cn(x.course)} · <span class="accent">${Math.max(0,n)} days</span>`) }).join('')||empty('No upcoming exams entered.');$('sync').textContent='Live from Notion · '+new Date(d.updatedAt).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});}catch(e){$('sync').textContent=e.message}}load();setInterval(load,12e4);</script></body></html>
