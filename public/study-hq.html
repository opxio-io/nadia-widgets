<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fall 2026 HQ</title><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#fff;font-family:'Satoshi',-apple-system,sans-serif}.wrap{padding:20px;--card:#222;--line:rgba(255,255,255,.07);--muted:rgba(255,255,255,.4);--sub:rgba(255,255,255,.28);--g:#C8FF00}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.eyebrow,.lbl{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}h1{font-size:22px;margin:2px 0;font-weight:900;letter-spacing:-.04em}.clock{text-align:right;font-size:10px;color:var(--sub)}.courses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}.course,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.course{padding:14px}.code{font-size:13px;font-weight:900}.name{font-size:10px;color:var(--muted);margin-top:3px;min-height:28px}.bar{height:4px;background:rgba(255,255,255,.06);border-radius:8px;margin-top:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--g)}.meta{font-size:10px;color:var(--sub);margin-top:5px}.grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:10px}.card{padding:14px 18px;min-height:175px}.card h2{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding-bottom:9px;border-bottom:1px solid var(--line)}.item{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}.item:last-child{border:0}.accent{color:var(--g)}.empty{font-size:11px;color:var(--sub);padding:12px 0}.wide{grid-column:span 2}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}.kpi{min-height:auto}.kpi strong{display:block;font-size:24px;margin-top:5px}@media(max-width:900px){.courses,.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:10px}.courses,.kpis,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.clock{display:none}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Fall 2026 · Opxio Notion</div><h1>University Study HQ</h1><div id="sync" class="meta">Connecting to Notion…</div></div><div class="clock"><div id="date"></div><strong id="time"></strong></div></header><section class="kpis"><div class="card kpi"><span class="lbl">Active courses</span><strong id="kc">—</strong></div><div class="card kpi"><span class="lbl">Open coursework</span><strong id="kw">—</strong></div><div class="card kpi"><span class="lbl">Scheduled sessions</span><strong id="ks">—</strong></div><div class="card kpi"><span class="lbl">Credits now</span><strong id="kr">—</strong></div></section><section class="courses" id="courses"></section><section class="grid"><article class="card wide"><h2>Today / Schedule</h2><div id="today"></div></article><article class="card"><h2>Upcoming Deadlines</h2><div id="deadlines"></div></article><article class="card"><h2>Coursework Queue</h2><div id="queue"></div></article><article class="card"><h2>Weekly Class Pattern</h2><div id="week"></div></article><article class="card"><h2>Exam Countdown</h2><div id="exams"></div></article></section></main><script>const $=x=>document.getElementById(x),day=x=>new Date(x).toLocaleDateString('en-CA'),fmt=x=>new Date(x).toLocaleDateString('en-CA',{month:'short',day:'numeric'}),empty=t=>`<div class="empty">${t}</div>`,item=(a,b)=>`<div class="item">${a}<div class="meta">${b||''}</div></div>`;function clock(){let n=new Date;$('date').textContent=n.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});$('time').textContent=n.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,3e4);async function load(){try{let r=await fetch('/api/study-hq',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load Fall 2026 data');let active=d.courses.filter(c=>c.status==='In progress'),map=Object.fromEntries(d.courses.map(c=>[c.id,c])),cn=ids=>ids.map(id=>map[id]?.code).filter(Boolean).join(', '),now=new Date,today=day(now),weekday=now.toLocaleDateString('en-CA',{weekday:'long'}),open=d.coursework.filter(x=>x.status!=='Complete'),scheduled=d.classes.filter(x=>x.time||x.days.length||x.date);$('kc').textContent=active.length;$('kw').textContent=open.length;$('ks').textContent=scheduled.length;$('kr').textContent=active.reduce((n,c)=>n+(Number(c.credits)||0),0);$('courses').innerHTML=active.map(c=>{let progress=typeof c.assignmentProgress==='number'?c.assignmentProgress*100:0;return `<div class="course"><div class="code">${c.code||'Course'}</div><div class="name">${c.subject||c.category||''}</div><div class="bar"><span style="width:${Math.max(4,Math.min(100,progress))}%"></span></div><div class="meta">${c.credits!=null?c.credits+' cr · ':''}${c.tasksDue??0} tasks due</div></div>`}).join('')||empty('No active Fall 2026 courses.');let todays=scheduled.filter(x=>(x.date&&day(x.date)===today)||(!x.date&&x.days.includes(weekday)));$('today').innerHTML=todays.map(x=>item(x.name||cn(x.course)||'Class',`${x.time||''}${x.type?' · '+x.type:''}${x.room?' · '+x.room:''}${x.campus?' · '+x.campus:''}`)).join('')||empty('No classes scheduled today.');let dated=open.filter(x=>x.due&&new Date(x.due)>=new Date(now.toDateString())).sort((a,b)=>new Date(a.due)-new Date(b.due));$('deadlines').innerHTML=dated.slice(0,6).map(x=>item(x.title||x.type,`${cn(x.course)}${cn(x.course)?' · ':''}${fmt(x.due)} · ${x.type||'Coursework'}`)).join('')||empty('No upcoming Fall 2026 deadlines entered yet.');$('queue').innerHTML=open.slice(0,6).map(x=>item(x.title||x.type,`${cn(x.course)}${cn(x.course)?' · ':''}${x.status||'Not started'}${x.due?' · '+fmt(x.due):''}`)).join('')||empty('Coursework queue is clear.');let pattern=scheduled.filter(x=>x.days.length&&x.time).sort((a,b)=>(a.days[0]||'').localeCompare(b.days[0]||'')||(a.time||'').localeCompare(b.time||''));$('week').innerHTML=pattern.slice(0,10).map(x=>item(x.name||cn(x.course),`${x.days.join(', ')} · ${x.time}${x.type?' · '+x.type:''}`)).join('')||empty('No weekly class pattern entered.');let exams=dated.filter(x=>/exam|quiz/i.test(x.type||''));$('exams').innerHTML=exams.slice(0,5).map(x=>{let n=Math.ceil((new Date(x.due)-now)/864e5);return item(x.title||x.type,`${cn(x.course)}${cn(x.course)?' · ':''}<span class="accent">${Math.max(0,n)} days</span>`) }).join('')||empty('No upcoming exams entered.');$('sync').textContent='Live from Opxio Notion · '+new Date(d.updatedAt).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});}catch(e){$('sync').textContent=e.message}}load();setInterval(load,12e4);</script></body></html>
