<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>University Study HQ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#302e2a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8b8275}.title{font-family:Georgia,serif;font-size:30px;margin:3px 0}.clock{text-align:right;font-size:13px;color:#6f685e}.courses{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.course,.card{background:rgba(255,255,255,.65);border:1px solid #ded7ca;border-radius:16px;box-shadow:0 5px 18px rgba(65,55,40,.04)}.course{padding:14px}.code{font-size:12px;font-weight:700}.name{font-size:12px;color:#746d63;margin-top:4px;min-height:32px}.bar{height:5px;background:#e7e0d5;border-radius:8px;margin-top:12px;overflow:hidden}.bar span{display:block;height:100%;background:#9d968a;border-radius:8px}.grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px}.card{padding:17px;min-height:190px}.card h2{font-family:Georgia,serif;font-size:18px;margin:0 0 12px}.item{padding:10px 0;border-bottom:1px solid #e5ded3}.item:last-child{border:0}.meta{font-size:11px;color:#8a8277;margin-top:4px}.pill{display:inline-block;padding:3px 7px;border:1px solid #d8d0c3;border-radius:20px;font-size:10px;margin-right:5px}.empty{font-size:12px;color:#91897e;padding:12px 0}.wide{grid-column:span 2}.status{font-size:11px;color:#80786d;margin-top:5px}.error{background:#fff3ee;border-color:#e8c9bb}@media(max-width:850px){.courses{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:560px){.wrap{padding:15px}.top{align-items:start}.courses,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.title{font-size:25px}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Fall 2026</div><h1 class="title">University Study HQ</h1><div class="status" id="sync">Connecting to Notion…</div></div><div class="clock"><div id="date"></div><strong id="time"></strong></div></header><section class="courses" id="courses"></section><section class="grid"><article class="card wide"><h2>Today</h2><div id="today"></div></article><article class="card"><h2>Upcoming Deadlines</h2><div id="deadlines"></div></article><article class="card"><h2>Study Queue</h2><div id="queue"></div></article><article class="card"><h2>This Week</h2><div id="week"></div></article><article class="card"><h2>Exam Countdown</h2><div id="exams"></div></article></section></main><script>const $=id=>document.getElementById(id),fmt=d=>new Intl.DateTimeFormat('en-CA',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(d)),dayKey=d=>new Date(d).toLocaleDateString('en-CA');function clock(){const n=new Date();$('date').textContent=n.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});$('time').textContent=n.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,30000);function empty(s='Nothing scheduled.'){return `<div class="empty">${s}</div>`}function courseName(ids,map){return ids.map(id=>map[id]?.code||map[id]?.name).filter(Boolean).join(', ')}function item(title,meta){return `<div class="item"><div>${title||'Untitled'}</div><div class="meta">${meta||''}</div></div>`}async function load(){try{const r=await fetch('/api/study-hq',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load');const map=Object.fromEntries(d.courses.map(c=>[c.id,c]));$('courses').innerHTML=d.courses.filter(c=>c.active!==false).map(c=>{const grade=c.currentGrade??0;return `<div class="course"><div class="code">${c.code||c.name}</div><div class="name">${c.name}</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,grade))}%"></span></div><div class="meta">${c.currentGrade!=null?`${c.currentGrade}% current`:c.type||'Course'}</div></div>`}).join('')||empty('Add courses in Notion.');const now=new Date(),today=dayKey(now),weekEnd=new Date(now);weekEnd.setDate(now.getDate()+7);const todaysClasses=d.classes.filter(x=>x.when&&dayKey(x.when)===today).sort((a,b)=>new Date(a.when)-new Date(b.when));const todaysSessions=d.sessions.filter(x=>x.when&&dayKey(x.when)===today).sort((a,b)=>new Date(a.when)-new Date(b.when));$('today').innerHTML=[...todaysClasses.map(x=>item(x.name,`${fmt(x.when)} · ${courseName(x.course,map)}${x.location?' · '+x.location:''}`)),...todaysSessions.map(x=>item(x.session,`${fmt(x.when)} · ${courseName(x.course,map)}${x.method?' · '+x.method:''}`))].join('')||empty();const open=d.tasks.filter(x=>x.due&&!x.submitted&&String(x.status).toLowerCase()!=='done').sort((a,b)=>new Date(a.due)-new Date(b.due));$('deadlines').innerHTML=open.slice(0,5).map(x=>item(x.task,`${courseName(x.course,map)} · due ${fmt(x.due)}${x.weight!=null?' · '+x.weight+'%':''}`)).join('')||empty('No open deadlines.');$('queue').innerHTML=d.sessions.filter(x=>!x.completed&&(!x.when||new Date(x.when)>=new Date(now.toDateString()))).sort((a,b)=>new Date(a.when||'2999')-new Date(b.when||'2999')).slice(0,5).map(x=>item(x.session,`${courseName(x.course,map)}${x.topic?' · '+x.topic:''}${x.plannedMinutes?' · '+x.plannedMinutes+' min':''}`)).join('')||empty('No study sessions queued.');$('week').innerHTML=d.classes.filter(x=>x.when&&new Date(x.when)>=now&&new Date(x.when)<=weekEnd).sort((a,b)=>new Date(a.when)-new Date(b.when)).slice(0,7).map(x=>item(x.name,`${fmt(x.when)} · ${courseName(x.course,map)}`)).join('')||empty('No classes in the next 7 days.');const exams=open.filter(x=>/midterm|final exam|quiz/i.test(x.type));$('exams').innerHTML=exams.slice(0,5).map(x=>{const days=Math.ceil((new Date(x.due)-now)/86400000);return item(x.task,`${courseName(x.course,map)} · ${Math.max(0,days)} day${days===1?'':'s'} left`)}).join('')||empty('No upcoming exams entered.');$('sync').textContent=`Live from Notion · updated ${new Date(d.updatedAt).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}`;}catch(e){$('sync').textContent=e.message;$('sync').style.color='#a24f38';['courses','today','deadlines','queue','week','exams'].forEach(id=>$(id).innerHTML=empty('Waiting for the Notion connection.'))}}load();setInterval(load,120000);</script></body></html>
