<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plant Care Hub</title><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#fff;font-family:'Satoshi',-apple-system,sans-serif}.shell{--card:#222;--border:rgba(255,255,255,.07);--muted:rgba(255,255,255,.4);--sub:rgba(255,255,255,.3);--g:#C8FF00;padding:20px;min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.eyebrow,.lbl{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:22px;margin:2px 0;font-weight:900;letter-spacing:-.04em}.sync{font-size:10px;color:var(--sub)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px}.val{font-size:36px;font-weight:900;letter-spacing:-1.5px;margin-top:10px}.accent{color:var(--g)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:8px}.plants{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.plant{padding:13px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.025)}.plant b{font-size:13px}.meta{font-size:10px;color:var(--sub);margin-top:4px}.item{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}.tag{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:6px;background:rgba(200,255,0,.08);border:1px solid rgba(200,255,0,.18);color:var(--g);font-size:9px;font-weight:700}.empty{font-size:11px;color:var(--sub);padding:12px 0}@media(max-width:650px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:430px){.shell{padding:10px}.plants{grid-template-columns:1fr}.val{font-size:28px}}</style></head><body><main class="shell"><header class="header"><div><div class="eyebrow">Nadia Life HQ</div><h1>Plant Care Hub</h1><div id="sync" class="sync">Connecting…</div></div></header><section class="kpis"><div class="card"><div class="lbl">Plants</div><div id="total" class="val accent">—</div></div><div class="card"><div class="lbl">Water due</div><div id="due" class="val">—</div></div><div class="card"><div class="lbl">Need attention</div><div id="attention" class="val">—</div></div><div class="card"><div class="lbl">Fertilize next</div><div id="fert" class="val">—</div></div></section><section class="grid"><article class="card"><div class="title">Plant collection</div><div id="plants" class="plants"></div></article><article class="card"><div class="title">Next watering</div><div id="watering"></div><div class="title" style="margin-top:16px">Care signals</div><div id="signals"></div></article></section></main><script>const $=x=>document.getElementById(x),fmt=x=>new Date(x).toLocaleDateString('en-CA',{month:'short',day:'numeric'}),empty=t=>`<div class="empty">${t}</div>`;async function load(){try{let r=await fetch('/api/study-hq',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);let now=new Date,day=new Date(now.getFullYear(),now.getMonth(),now.getDate()),p=d.plants||[],due=p.filter(x=>x.nextWater&&new Date(x.nextWater)<=day),attention=p.filter(x=>x.health==='Needs Attention'),fert=p.filter(x=>x.nextFertilize).sort((a,b)=>new Date(a.nextFertilize)-new Date(b.nextFertilize));$('total').textContent=p.length;$('due').textContent=due.length;$('attention').textContent=attention.length;$('fert').textContent=fert.length?Math.max(0,Math.ceil((new Date(fert[0].nextFertilize)-day)/864e5)):'—';$('plants').innerHTML=p.map(x=>`<div class="plant"><b>${x.name||x.commonName||'Unnamed plant'}</b><div class="meta">${x.scientificName||x.commonName||'Species —'} · ${x.room||'Room —'}</div><div class="meta">${x.light||'Light —'} · ${x.health||'Health —'}</div><div class="meta">${x.nextWater?'Next water '+fmt(x.nextWater):'Set next watering'}</div>${x.petSafe?'<span class="tag">PET SAFE</span>':''}</div>`).join('')||empty('Add your first plant in Notion.');$('watering').innerHTML=p.filter(x=>x.nextWater).sort((a,b)=>new Date(a.nextWater)-new Date(b.nextWater)).slice(0,8).map(x=>`<div class="item">${x.name||x.commonName}<div class="meta">${fmt(x.nextWater)} · ${x.room||''}</div></div>`).join('')||empty('No watering dates set.');$('signals').innerHTML=[...attention,...due.filter(x=>!attention.includes(x))].slice(0,7).map(x=>`<div class="item">${x.name||x.commonName}<div class="meta">${x.health==='Needs Attention'?'Needs attention':'Watering due'}${x.nextWater?' · '+fmt(x.nextWater):''}</div></div>`).join('')||empty('Everything looks calm.');$('sync').textContent='Live from Notion · '+new Date(d.updatedAt).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});}catch(e){$('sync').textContent=e.message}}load();setInterval(load,12e4);</script></body></html>
