<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Degree Planner</title><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#fff;font-family:'Satoshi',-apple-system,sans-serif}.shell{--card:#222;--border:rgba(255,255,255,.07);--muted:rgba(255,255,255,.42);--sub:rgba(255,255,255,.58);--purple:#b9a6ff;--green:#9ed49a;--blue:#7cb8ff;min-height:100vh;padding:18px}.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}.eyebrow,.label{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}h1{font-size:25px;margin:3px 0 0;letter-spacing:-1px}.sync{font-size:9px;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:9px}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px}.kpi b{display:block;font-size:32px;letter-spacing:-1.5px;margin:8px 0 2px}.kpi small{font-size:9px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:9px}.panelHead{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:4px}.panelHead h2{font-size:11px;margin:0;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.course{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.055)}.course:last-child{border:0}.courseTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.course b{font-size:13px}.meta{font-size:9.5px;color:var(--muted);margin-top:3px}.pill{font-size:8px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--border);border-radius:999px;padding:3px 7px;color:var(--sub)}.pill.progress{color:var(--blue)}.pill.completed{color:var(--green)}.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--purple);border-radius:5px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.mini{font-size:8.5px;color:var(--muted)}.mini strong{color:var(--sub);font-size:10px}.program{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}.program:last-child{border:0}.programTop{display:flex;justify-content:space-between;font-size:10px}.empty{font-size:10px;color:var(--muted);padding:12px 0}@media(max-width:650px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.shell{padding:10px}}</style></head><body><main class="shell"><header class="header"><div><div class="eyebrow">Academic system</div><h1>Degree Planner</h1></div><div id="sync" class="sync">Connecting to Notion…</div></header><section class="kpis"><div class="card kpi"><span class="label">Total courses</span><b id="total">—</b><small>degree plan</small></div><div class="card kpi"><span class="label">In progress</span><b id="active">—</b><small>current courses</small></div><div class="card kpi"><span class="label">Completed</span><b id="done">—</b><small>finished courses</small></div><div class="card kpi"><span class="label">Credits</span><b id="credits">—</b><small>completed / total planned</small></div></section><section class="grid"><article class="card"><div class="panelHead"><h2>Course roadmap</h2><span class="sync">live database</span></div><div id="courses"></div></article><aside class="card"><div class="panelHead"><h2>Program breakdown</h2></div><div id="programs"></div></aside></section></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pct=v=>{v=Number(v);return Number.isFinite(v)?Math.max(0,Math.min(100,v<=1?v*100:v)):0},fmt=v=>Number.isFinite(Number(v))?Number(v).toFixed(Number(v)%1?1:0):'0';async function load(){try{const r=await fetch('/api/study-hq',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load degree data');const c=d.courses||[],done=c.filter(x=>x.status==='Completed'),active=c.filter(x=>x.status==='In progress'),totalCredits=c.reduce((n,x)=>n+(Number(x.credits)||0),0),doneCredits=done.reduce((n,x)=>n+(Number(x.credits)||0),0);$('total').textContent=c.length;$('active').textContent=active.length;$('done').textContent=done.length;$('credits').textContent=`${fmt(doneCredits)} / ${fmt(totalCredits)}`;const order={"In progress":0,Planned:1,Completed:2};$('courses').innerHTML=[...c].sort((a,b)=>(order[a.status]??9)-(order[b.status]??9)||(a.code||'').localeCompare(b.code||'')).map(x=>{const ap=pct(x.assignmentProgress),ep=pct(x.examProgress),overall=Math.round((ap+ep)/2);return `<div class="course"><div class="courseTop"><div><b>${esc(x.code||'Course')}</b><div class="meta">${esc(x.subject||'')}${x.credits!=null?' · '+esc(x.credits)+' cr':''}${x.category?' · '+esc(x.category):''}</div></div><span class="pill ${x.status==='Completed'?'completed':x.status==='In progress'?'progress':''}">${esc(x.status||'—')}</span></div>${x.status==='In progress'?`<div class="bar"><i style="width:${overall}%"></i></div><div class="statrow"><div class="mini"><strong>${Math.round(ap)}%</strong><br>assignments</div><div class="mini"><strong>${Math.round(ep)}%</strong><br>exams</div><div class="mini"><strong>${esc(x.tasksDue??'—')}</strong><br>tasks due</div></div>`:''}</div>`}).join('')||'<div class="empty">No courses found.</div>';const programs={};c.forEach(x=>(x.program||[]).forEach(p=>{programs[p]??={total:0,done:0,credits:0};programs[p].total++;if(x.status==='Completed')programs[p].done++;programs[p].credits+=Number(x.credits)||0}));$('programs').innerHTML=Object.entries(programs).sort((a,b)=>b[1].total-a[1].total).map(([p,v])=>`<div class="program"><div class="programTop"><b>${esc(p)}</b><span>${v.done}/${v.total}</span></div><div class="meta">${fmt(v.credits)} planned credits</div><div class="bar"><i style="width:${v.total?Math.round(v.done/v.total*100):0}%"></i></div></div>`).join('')||'<div class="empty">No program data.</div>';$('sync').textContent='Live from Notion · '+new Date(d.updatedAt).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}catch(e){$('sync').textContent=e.message}}load();setInterval(load,12e4);</script></body></html>
