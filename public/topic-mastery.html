<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic Mastery</title><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#f4f4f4;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:12px;max-width:900px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.ey{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.1em}h1{font-size:19px;margin:2px 0}.pct{font-size:23px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.tab{padding:8px 5px;border:1px solid #343434;border-radius:9px;background:#222;color:#aaa;font-weight:650;cursor:pointer}.tab.on{background:#eee;color:#111}.summary{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:#222;border:1px solid #303030;border-radius:11px;padding:10px 12px;margin-bottom:8px}.bar{height:5px;background:#383838;border-radius:10px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#eee}.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.week{background:#222;border:1px solid #303030;border-radius:11px;overflow:hidden}.wh{padding:9px 11px;display:flex;justify-content:space-between;cursor:pointer;font-weight:700}.wh small{color:#888;font-weight:500}.topics{border-top:1px solid #303030;padding:4px 10px 7px}.topic{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:5px 0}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:4px}.btn{border:1px solid #3b3b3b;background:#292929;color:#aaa;border-radius:6px;padding:3px 6px;font-size:10px;cursor:pointer}.btn.on{background:#e8e8e8;color:#111}.conf{min-width:58px}.lost{color:#ff7777}.weak{color:#ffb36b}.okay{color:#ffe36b}.good{color:#91e6a7}.master{color:#8fc7ff}.hide{display:none}.msg{padding:20px;text-align:center;color:#777}@media(max-width:650px){.weeks{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="wrap"><div class="head"><div><div class="ey">Fall 2026 · live Notion tracker</div><h1 id="title">Topic Mastery</h1></div><div class="pct" id="pct">—</div></div><div class="tabs" id="tabs"></div><div id="app" class="msg">Loading…</div></main><script>
const E=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),A=a=>a.length?Math.round(a.reduce((n,x)=>n+(+x.mastery||0),0)/a.length):0,O=w=>+(String(w).match(/\d+/)||[99])[0];let D=[],C={},F='';
function cc(c){return c.includes('Mastered')?'master':c.includes('Confident')?'good':c.includes('Okay')?'okay':c.includes('Weak')?'weak':'lost'}
function render(){let r=D.filter(x=>C[x.course[0]]?.code===F),p=A(r);pct.textContent=p+'%';title.textContent=F+' Mastery';let W={};r.forEach(x=>(W[x.week]??=[]).push(x));app.className='';app.innerHTML='<div class="summary"><div><b>'+r.length+' topics</b><div class="bar"><div class="fill" style="width:'+p+'%"></div></div></div><span>'+r.filter(x=>+x.mastery>=90).length+' mastered</span></div><div class="weeks">'+Object.keys(W).sort((a,b)=>O(a)-O(b)).map(w=>{let a=W[w];return '<section class="week"><div class="wh" onclick="this.nextElementSibling.classList.toggle(\'hide\')"><span>'+E(w)+'</span><small>'+A(a)+'% · '+a.length+'</small></div><div class="topics">'+a.map(x=>'<div class="topic"><span class="name" title="'+E(x.subtopic)+'">'+E(x.subtopic)+'</span><div class="actions"><button class="btn '+(x.learned?'on':'')+'" onclick="setv(\''+x.id+'\',\'learned\','+!x.learned+')">L</button><button class="btn '+(x.practiced?'on':'')+'" onclick="setv(\''+x.id+'\',\'practiced\','+!x.practiced+')">P</button><button class="btn '+(x.alone?'on':'')+'" onclick="setv(\''+x.id+'\',\'alone\','+!x.alone+')">A</button><button class="btn conf '+cc(x.confidence)+'" onclick="cycle(\''+x.id+'\')">'+E(x.confidence.replace(/^[^ ]+ /,''))+'</button></div></div>').join('')+'</div></section>'}).join('')+'</div>'}
async function patch(id,body){let r=await fetch('/api/topic-mastery',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...body})});if(!r.ok)throw Error('Save failed');return r.json()}
async function setv(id,k,v){let x=D.find(y=>y.id===id),old=x[k];x[k]=v;render();try{await patch(id,{[k]:v});await load(false)}catch(e){x[k]=old;render()}}
async function cycle(id){let x=D.find(y=>y.id===id),q=['🔴 Lost','🟠 Weak','🟡 Okay','🟢 Confident','🔵 Mastered'],n=q[(q.indexOf(x.confidence)+1)%q.length],old=x.confidence;x.confidence=n;render();try{await patch(id,{confidence:n});await load(false)}catch(e){x.confidence=old;render()}}
async function load(first=true){let d=await fetch('/api/study-hq',{cache:'no-store'}).then(r=>r.json());D=d.mastery||[];C=Object.fromEntries((d.courses||[]).map(c=>[c.id,c]));let codes=[...new Set(D.map(x=>C[x.course[0]]?.code).filter(Boolean))];if(!F||!codes.includes(F))F=codes[0]||'';if(first){tabs.innerHTML=codes.map(x=>'<button class="tab '+(x===F?'on':'')+'" data-x="'+E(x)+'">'+E(x)+'</button>').join('');tabs.onclick=e=>{if(!e.target.dataset.x)return;F=e.target.dataset.x;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.x===F));render()}}render()}load().catch(()=>app.innerHTML='Could not load Notion data.');
</script></body></html>
