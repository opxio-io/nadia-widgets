<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic Mastery</title><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#f5f5f5;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:18px;max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:end}.ey{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.1em}h1{margin:4px 0 0;font-size:24px}.overall{text-align:right}.big{font-size:30px;font-weight:800}.muted{color:#888;font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}.tab{border:1px solid #333;background:#222;color:#bbb;border-radius:999px;padding:7px 11px;cursor:pointer}.tab.on{background:#f1f1f1;color:#111}.course{background:#222;border:1px solid #303030;border-radius:14px;margin:10px 0;overflow:hidden}.chead{padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer}.code{font-weight:750;min-width:75px}.bar{height:6px;background:#333;border-radius:9px;flex:1;overflow:hidden}.fill{height:100%;background:#eee}.pct{font-weight:700;width:40px;text-align:right}.weeks{padding:0 14px 13px}.week{border-top:1px solid #303030;padding:11px 0}.whead{display:flex;justify-content:space-between;cursor:pointer;font-weight:650}.topics{padding-top:7px}.topic{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;color:#ddd}.pill{font-size:11px;border-radius:99px;padding:3px 7px;background:#303030}.lost{color:#ff7777}.weak{color:#ffb36b}.okay{color:#ffe36b}.good{color:#91e6a7}.master{color:#8fc7ff}.hide{display:none}.empty{padding:30px;text-align:center;color:#777}@media(max-width:600px){.wrap{padding:10px}.overall .muted{display:none}.big{font-size:23px}.topic{font-size:13px}}</style></head><body><main class="wrap"><div class="top"><div><div class="ey">Fall 2026 · Study Progress</div><h1>Topic Mastery</h1></div><div class="overall"><div class="big" id="overall">—</div><div class="muted">overall mastery</div></div></div><div class="tabs" id="tabs"></div><div id="app"><div class="empty">Loading your topics…</div></div></main><script>
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])), avg=a=>a.length?Math.round(a.reduce((n,x)=>n+(+x.mastery||0),0)/a.length):0, order=w=>+(String(w).match(/\d+/)||[99])[0];let DATA=[],COURSES={},filter='All';
function cls(c){return c.includes('Mastered')?'master':c.includes('Confident')?'good':c.includes('Okay')?'okay':c.includes('Weak')?'weak':'lost'}
function render(){let rows=filter==='All'?DATA:DATA.filter(x=>COURSES[x.course[0]]?.code===filter);document.getElementById('overall').textContent=avg(DATA)+'%';let groups={};rows.forEach(x=>{let id=x.course[0]||'none';(groups[id]??=[]).push(x)});document.getElementById('app').innerHTML=Object.entries(groups).map(([id,rs])=>{let c=COURSES[id]||{code:'Course'},p=avg(rs),weeks={};rs.forEach(x=>(weeks[x.week]??=[]).push(x));return '<section class="course"><div class="chead" onclick="this.nextElementSibling.classList.toggle(\'hide\')"><span class="code">'+esc(c.code)+'</span><div class="bar"><div class="fill" style="width:'+p+'%"></div></div><span class="pct">'+p+'%</span></div><div class="weeks">'+Object.keys(weeks).sort((a,b)=>order(a)-order(b)).map(w=>{let a=weeks[w],wp=avg(a);return '<div class="week"><div class="whead" onclick="this.nextElementSibling.classList.toggle(\'hide\')"><span>'+esc(w)+'</span><span class="muted">'+wp+'% · '+a.length+' topics</span></div><div class="topics">'+a.map(x=>'<div class="topic"><span>'+esc(x.subtopic)+'</span><span class="pill '+cls(x.confidence)+'">'+esc(x.confidence.replace(/^[^ ]+ /,''))+' · '+(+x.mastery||0)+'%</span></div>').join('')+'</div></div>'}).join('')+'</div></section>'}).join('')||'<div class="empty">No topics here.</div>'}
fetch('/api/study-hq',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d.mastery||[];COURSES=Object.fromEntries((d.courses||[]).map(c=>[c.id,c]));let codes=[...new Set(DATA.map(x=>COURSES[x.course[0]]?.code).filter(Boolean))];document.getElementById('tabs').innerHTML=['All',...codes].map(x=>'<button class="tab '+(x==='All'?'on':'')+'" data-x="'+esc(x)+'">'+esc(x)+'</button>').join('');document.getElementById('tabs').onclick=e=>{if(!e.target.dataset.x)return;filter=e.target.dataset.x;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.x===filter));render()};render()}).catch(()=>document.getElementById('app').innerHTML='<div class="empty">Could not load Notion data.</div>');
</script></body></html>
