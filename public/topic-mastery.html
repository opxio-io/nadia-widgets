<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic Mastery</title><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#f4f4f4;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:16px;max-width:920px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.ey{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.1em}h1{font-size:19px;margin:2px 0}.pct{font-size:23px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.legend{font-size:11px;color:#999;margin:0 2px 12px;line-height:1.55}.legend span{display:none}.legend b{font-weight:500}.tab{padding:8px 5px;border:1px solid #343434;border-radius:9px;background:#222;color:#aaa;font-weight:650;cursor:pointer}.tab.on{background:#eee;color:#111}.summary{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:#222;border:1px solid #303030;border-radius:11px;padding:12px 14px;margin-bottom:12px}.bar{height:5px;background:#383838;border-radius:10px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#eee}.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}.week{background:#222;border:1px solid #303030;border-radius:12px;overflow:hidden}.week.current{border-color:#777}.currentmark{font-size:9px;background:#eee;color:#111;border-radius:99px;padding:2px 6px;margin-left:6px}.dates{color:#777;font-size:10px;margin-left:5px}.wh{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px}.wh:hover{background:#292929}.wh small:after{content:"  ▾";margin-left:7px}.week.expanded .wh small:after{content:"  ▴"}.wh small{white-space:nowrap}.wh small{color:#888;font-weight:500}.topics{border-top:1px solid #303030;padding:8px 13px 12px}.topic+.topic{border-top:1px solid #303030}.topic{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 1px}.name{white-space:normal;overflow-wrap:anywhere;font-weight:550;line-height:1.4}.actions{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-shrink:0}.btn{border:1px solid #3b3b3b;background:#292929;color:#aaa;border-radius:6px;padding:4px 7px;font-size:10px;cursor:pointer}.btn.on{background:#e8e8e8;color:#111}.conf{min-width:142px;text-align:left;padding:7px 9px;font-size:12px}.review{font-size:15px;padding:5px 8px;min-width:32px}.review.on{background:#b58b44;color:#191919}.topic .name{font-size:12px}.lost{color:#ff7777}.weak{color:#ffb36b}.okay{color:#ffe36b}.good{color:#91e6a7}.master{color:#8fc7ff}.hide{display:none}.msg{padding:20px;text-align:center;color:#777}@media(max-width:650px){.topic{align-items:flex-start;flex-direction:column;gap:5px}.actions{width:100%;justify-content:space-between}.conf{flex:1;max-width:240px}.legend span{float:none;display:block;margin-top:3px}.weeks{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="wrap"><div class="head"><div><div class="ey">Fall 2026 · live Notion tracker</div><h1 id="title">Topic Mastery</h1></div><div class="pct" id="pct">—</div></div><div class="tabs" id="tabs"></div><div class="legend"><b>Choose a stage for each skill. ↻ flags anything you want to revisit.</b><span>Confidence: 🔴 Lost → 🟠 Weak → 🟡 Okay → 🟢 Confident → 🔵 Mastered · Mastery requires independent work</span></div><div id="app" class="msg">Loading…</div></main><script>
const E=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),A=a=>a.length?Math.round(a.reduce((n,x)=>n+(+x.mastery||0),0)/a.length):0,O=w=>+(String(w).match(/\d+/)||[99])[0];let D=[],C={},F='',openGroups=new Set();const FALL={'797fe600-97f6-83f7-a3ee-8184a6a63f24':'MATH 203','640fe600-97f6-8398-a70c-813800abadbf':'MATH 204','f40fe600-97f6-83fc-bdc6-01fa2fba6b85':'PHYS 204','a3dfe600-97f6-82d8-b6cd-01ee3d8b6632':'PHIL 235'};const code=x=>C[x]?.code||FALL[x]||'';
function shortName(w){const map={'Functions & graphs':'Functions & Graphs','Inverse functions & logarithms':'Logs & Inverses','Inverse functions & rates':'Rates & Inverses','Continuity & derivatives':'Continuity & Derivatives','Chain & implicit differentiation':'Chain & Implicit Rules','Inverse derivatives':'Inverse Derivatives','Applications of derivatives':'Applications','Limits & extrema':'Limits & Extrema','Curve analysis':'Curve Analysis','Optimization':'Optimization','Review':'Review'};return map[w]||w}function toggleGroup(k){if(openGroups.has(k))openGroups.delete(k);else openGroups.add(k);render()}function stage(x){if(x.alone&&x.confidence==='🔵 Mastered')return 4;if(x.alone)return 3;if(x.practiced)return 2;if(x.learned)return 1;return 0}const ST=['⚪ Not started','🟡 Learning','🟠 Practicing','🟢 Can do alone','🔵 Mastered'];function cc(c){return c.includes('Mastered')?'master':c.includes('Confident')?'good':c.includes('Okay')?'okay':c.includes('Weak')?'weak':'lost'}
const START=new Date('2026-09-07T00:00:00-04:00');function wd(n){let s=new Date(START);s.setDate(s.getDate()+7*(n-1));let e=new Date(s);e.setDate(e.getDate()+6);let f=d=>d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});return f(s)+'–'+f(e)}function currentWeek(){let n=Math.floor((new Date()-START)/604800000)+1;return Math.max(1,Math.min(12,n))}function render(){let r=D.filter(x=>code(x.course[0])===F),p=r.length?Math.round(100*r.filter(x=>x.alone&&x.confidence==='🔵 Mastered').length/r.length):0;pct.textContent=p+'%';title.textContent=F+' Mastery';let W={};r.forEach(x=>{const group=F==="MATH 203"?(x.topic||x.week):x.week;(W[group]??=[]).push(x)});app.className='';app.innerHTML='<div class="summary"><div><b>'+r.length+' topics</b><div class="bar"><div class="fill" style="width:'+p+'%"></div></div></div><span>'+r.filter(x=>+x.mastery>=90).length+' mastered</span></div><div class="weeks">'+Object.keys(W).sort((a,b)=>Math.min(...W[a].map(x=>O(x.week)))-Math.min(...W[b].map(x=>O(x.week)))).map(w=>{let a=W[w];let n=O(a[0].week),cur=F!=='MATH 203'&&n===currentWeek();let opened=openGroups.has(F+'::'+w);return '<section class="week '+(cur?'current':'')+(opened?' expanded':'')+'"><div class="wh" role="button" tabindex="0" aria-expanded="'+opened+'" data-group="'+E(F+'::'+w)+'"><span>'+E(shortName(w))+' <span class="dates">'+(F==='MATH 203'?'':wd(n))+'</span>'+(cur?'<span class="currentmark">CURRENT</span>':'')+'</span><small>'+a.filter(x=>x.alone&&x.confidence==='🔵 Mastered').length+'/'+a.length+' mastered</small></div><div class="topics '+(opened?'':'hide')+'">'+a.map(x=>'<div class="topic"><span class="name" title="'+E(x.subtopic)+'">'+E(x.subtopic)+'</span><div class="actions"><button class="btn review '+(x.review?'on':'')+'" title="Flag for review" aria-label="Flag '+E(x.subtopic)+' for review" onclick="setv(\''+x.id+'\',\'review\','+!x.review+')">↻</button><select class="btn conf" aria-label="Progress for '+E(x.subtopic)+'" onchange="setstage(\''+x.id+'\',this.value)">'+ST.map((label,i)=>'<option value="'+i+'" '+(stage(x)===i?'selected':'')+'>'+label+'</option>').join('')+'</select></div></div>').join('')+'</div></section>'}).join('')+'</div>';app.querySelectorAll('[data-group]').forEach(el=>{el.onclick=()=>toggleGroup(el.dataset.group);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleGroup(el.dataset.group)}}})}
async function patch(id,body){let r=await fetch('/api/topic-mastery',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...body})});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Save failed');return j}
async function setv(id,k,v){let x=D.find(y=>y.id===id),old=x[k];x[k]=v;render();try{await patch(id,{[k]:v})}catch(e){x[k]=old;render();alert(e.message||'Save failed')}}
async function setstage(id,n){let x=D.find(y=>y.id===id);if(!x)return;let old={learned:x.learned,practiced:x.practiced,alone:x.alone,confidence:x.confidence};let v=Number(n);let next={learned:v>=1,practiced:v>=2,alone:v>=3,confidence:['🔴 Lost','🟡 Okay','🟠 Weak','🟢 Confident','🔵 Mastered'][v]};Object.assign(x,next);render();try{await patch(id,next)}catch(e){Object.assign(x,old);render();alert(e.message||'Save failed')}}async function setconf(id,n){let x=D.find(y=>y.id===id),old=x.confidence;x.confidence=n;render();try{await patch(id,{confidence:n})}catch(e){x.confidence=old;render();alert(e.message||'Save failed')}}
async function load(first=true){let d=await fetch('/api/study-hq',{cache:'no-store'}).then(r=>r.json());D=d.mastery||[];C=Object.fromEntries((d.courses||[]).map(c=>[c.id,c]));let codes=[...new Set(D.map(x=>code(x.course[0])).filter(Boolean))];if(!F||!codes.includes(F))F=codes[0]||'';if(first){tabs.innerHTML=codes.map(x=>'<button class="tab '+(x===F?'on':'')+'" data-x="'+E(x)+'">'+E(x)+'</button>').join('');tabs.onclick=e=>{if(!e.target.dataset.x)return;F=e.target.dataset.x;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.x===F));render()}}render()}load().catch(()=>app.innerHTML='Could not load Notion data.');
</script></body></html>
