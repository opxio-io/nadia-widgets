<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic Mastery</title><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#f4f4f4;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:12px;max-width:900px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.ey{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.1em}h1{font-size:19px;margin:2px 0}.pct{font-size:23px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.legend{font-size:11px;color:#888;margin:-2px 2px 9px}.legend span{float:right}.tab{padding:8px 5px;border:1px solid #343434;border-radius:9px;background:#222;color:#aaa;font-weight:650;cursor:pointer}.tab.on{background:#eee;color:#111}.summary{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:#222;border:1px solid #303030;border-radius:11px;padding:10px 12px;margin-bottom:8px}.bar{height:5px;background:#383838;border-radius:10px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#eee}.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.week{background:#222;border:1px solid #303030;border-radius:11px;overflow:hidden}.week.current{border-color:#777}.currentmark{font-size:9px;background:#eee;color:#111;border-radius:99px;padding:2px 6px;margin-left:6px}.dates{color:#777;font-size:10px;margin-left:5px}.wh{padding:9px 11px;display:flex;justify-content:space-between;cursor:pointer;font-weight:700}.wh small{color:#888;font-weight:500}.topics{border-top:1px solid #303030;padding:4px 10px 7px}.topic{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:5px 0}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:4px}.btn{border:1px solid #3b3b3b;background:#292929;color:#aaa;border-radius:6px;padding:4px 7px;font-size:10px;cursor:pointer}.btn.on{background:#e8e8e8;color:#111}.conf{min-width:58px}.lost{color:#ff7777}.weak{color:#ffb36b}.okay{color:#ffe36b}.good{color:#91e6a7}.master{color:#8fc7ff}.hide{display:none}.msg{padding:20px;text-align:center;color:#777}@media(max-width:650px){.legend span{float:none;display:block;margin-top:3px}.weeks{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="wrap"><div class="head"><div><div class="ey">Fall 2026 · live Notion tracker</div><h1 id="title">Topic Mastery</h1></div><div class="pct" id="pct">—</div></div><div class="tabs" id="tabs"></div><div class="legend"><b>L</b> Learned · <b>P</b> Practiced · <b>A</b> Can do alone <span>Confidence: 🔴 Lost → 🟠 Weak → 🟡 Okay → 🟢 Confident → 🔵 Mastered</span></div><div id="app" class="msg">Loading…</div></main><script>
const E=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),A=a=>a.length?Math.round(a.reduce((n,x)=>n+(+x.mastery||0),0)/a.length):0,O=w=>+(String(w).match(/\d+/)||[99])[0];let D=[],C={},F='';const FALL={'797fe600-97f6-83f7-a3ee-8184a6a63f24':'MATH 203','640fe600-97f6-8398-a70c-813800abadbf':'MATH 204','f40fe600-97f6-83fc-bdc6-01fa2fba6b85':'PHYS 204','a3dfe600-97f6-82d8-b6cd-01ee3d8b6632':'PHIL 235'};const code=x=>C[x]?.code||FALL[x]||'';
function cc(c){return c.includes('Mastered')?'master':c.includes('Confident')?'good':c.includes('Okay')?'okay':c.includes('Weak')?'weak':'lost'}
const START=new Date('2026-09-07T00:00:00-04:00');function wd(n){let s=new Date(START);s.setDate(s.getDate()+7*(n-1));let e=new Date(s);e.setDate(e.getDate()+6);let f=d=>d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});return f(s)+'–'+f(e)}function currentWeek(){let n=Math.floor((new Date()-START)/604800000)+1;return Math.max(1,Math.min(12,n))}function render(){let r=D.filter(x=>code(x.course[0])===F),p=A(r);pct.textContent=p+'%';title.textContent=F+' Mastery';let W={};r.forEach(x=>(W[x.week]??=[]).push(x));app.className='';app.innerHTML='<div class="summary"><div><b>'+r.length+' topics</b><div class="bar"><div class="fill" style="width:'+p+'%"></div></div></div><span>'+r.filter(x=>+x.mastery>=90).length+' mastered</span></div><div class="weeks">'+Object.keys(W).sort((a,b)=>O(a)-O(b)).map(w=>{let a=W[w];let n=O(w),cur=n===currentWeek();return '<section class="week '+(cur?'current':'')+'"><div class="wh" onclick="this.nextElementSibling.classList.toggle(\'hide\')"><span>'+E(w)+' <span class="dates">'+wd(n)+'</span>'+(cur?'<span class="currentmark">CURRENT</span>':'')+'</span><small>'+A(a)+'% · '+a.length+'</small></div><div class="topics">'+a.map(x=>'<div class="topic"><span class="name" title="'+E(x.subtopic)+'">'+E(x.subtopic)+'</span><div class="actions"><button class="btn '+(x.learned?'on':'')+'" onclick="setv(\''+x.id+'\',\'learned\','+!x.learned+')">L</button><button class="btn '+(x.practiced?'on':'')+'" onclick="setv(\''+x.id+'\',\'practiced\','+!x.practiced+')">P</button><button class="btn '+(x.alone?'on':'')+'" onclick="setv(\''+x.id+'\',\'alone\','+!x.alone+')">A</button><select class="btn conf '+cc(x.confidence)+'" onchange="setconf(\''+x.id+'\',this.value)"><option value="🔴 Lost" '+(x.confidence==='🔴 Lost'?'selected':'')+'>🔴 Lost</option><option value="🟠 Weak" '+(x.confidence==='🟠 Weak'?'selected':'')+'>🟠 Weak</option><option value="🟡 Okay" '+(x.confidence==='🟡 Okay'?'selected':'')+'>🟡 Okay</option><option value="🟢 Confident" '+(x.confidence==='🟢 Confident'?'selected':'')+'>🟢 Confident</option><option value="🔵 Mastered" '+(x.confidence==='🔵 Mastered'?'selected':'')+'>🔵 Mastered</option></select></div></div>').join('')+'</div></section>'}).join('')+'</div>'}
async function patch(id,body){let r=await fetch('/api/topic-mastery',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...body})});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Save failed');return j}
async function setv(id,k,v){let x=D.find(y=>y.id===id),old=x[k];x[k]=v;render();try{await patch(id,{[k]:v});await load(false)}catch(e){x[k]=old;render()}}
async function setconf(id,n){let x=D.find(y=>y.id===id),old=x.confidence;x.confidence=n;render();try{await patch(id,{confidence:n});await load(false)}catch(e){x.confidence=old;render()}}
async function load(first=true){let d=await fetch('/api/study-hq',{cache:'no-store'}).then(r=>r.json());D=d.mastery||[];C=Object.fromEntries((d.courses||[]).map(c=>[c.id,c]));let codes=[...new Set(D.map(x=>code(x.course[0])).filter(Boolean))];if(!F||!codes.includes(F))F=codes[0]||'';if(first){tabs.innerHTML=codes.map(x=>'<button class="tab '+(x===F?'on':'')+'" data-x="'+E(x)+'">'+E(x)+'</button>').join('');tabs.onclick=e=>{if(!e.target.dataset.x)return;F=e.target.dataset.x;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.x===F));render()}}render()}load().catch(()=>app.innerHTML='Could not load Notion data.');
</script></body></html>
