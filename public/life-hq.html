<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nadia Life HQ</title><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{--bg:#191919;--card:#222;--border:rgba(255,255,255,.07);--text:#fff;--muted:rgba(255,255,255,.4);--sub:rgba(255,255,255,.3);--g:#C8FF00;min-height:100vh;padding:14px}.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.eyebrow,.label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:20px;letter-spacing:-.03em;margin:2px 0;font-weight:800}.sync{font-size:10px;color:var(--sub)}.clock{text-align:right;font-size:11px;color:var(--muted)}.areas{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:10px}.area,.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px}.area .v{font-size:25px;font-weight:900;letter-spacing:-1px;margin-top:10px}.area .s{font-size:10px;color:var(--sub);margin-top:5px}.accent{color:var(--g)}.grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:10px}.wide{grid-column:span 2}.panel{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:6px}.panel h2{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}.item{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;font-weight:650}.item:last-child{border:0}.meta{font-size:10px;color:var(--sub);font-weight:500;margin-top:4px}.badge{font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(200,255,0,.12);color:var(--g);border:1px solid rgba(200,255,0,.18)}.empty{font-size:11px;color:var(--sub);padding:12px 0}.plantGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-top:6px}.plant{border:1px solid var(--border);border-radius:11px;padding:11px;background:rgba(255,255,255,.025)}.plant b{font-size:12px}.bar{height:4px;background:rgba(255,255,255,.07);border-radius:4px;margin-top:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--g)}@media(max-width:900px){.areas{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:560px){.areas,.grid,.plantGrid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="shell"><header class="header"><div><div class="eyebrow">Personal operating system</div><h1>Nadia Life HQ</h1><div id="sync" class="sync">Connecting to Notion…</div></div><div class="clock"><div id="date"></div><b id="time"></b></div></header><section class="areas"><div class="area"><div class="label">Open life tasks</div><div id="taskKpi" class="v accent">—</div><div class="s">across all areas</div></div><div class="area"><div class="label">University</div><div id="uniKpi" class="v">—</div><div class="s">open deadlines</div></div><div class="area"><div class="label">Plants</div><div id="plantKpi" class="v">—</div><div class="s">active collection</div></div><div class="area"><div class="label">Water due</div><div id="waterKpi" class="v">—</div><div class="s">today / overdue</div></div><div class="area"><div class="label">Active goals</div><div id="goalKpi" class="v">—</div><div class="s">goals + projects</div></div></section><section class="grid"><article class="card wide"><div class="panel"><h2>Next up across life</h2><span class="badge">Live</span></div><div id="lifeTasks"></div></article><article class="card"><div class="panel"><h2>Plant care</h2></div><div id="plants"></div></article><article class="card"><div class="panel"><h2>University deadlines</h2></div><div id="deadlines"></div></article><article class="card"><div class="panel"><h2>Goals & projects</h2></div><div id="goals"></div></article><article class="card"><div class="panel"><h2>Today</h2></div><div id="today"></div></article></section></main><script>const $=x=>document.getElementById(x),empty=t=>`<div class="empty">${t}</div>`,item=(a,b)=>`<div class="item">${a}<div class="meta">${b||''}</div></div>`,day=x=>new Date(x).toLocaleDateString('en-CA'),fmt=x=>new Date(x).toLocaleDateString('en-CA',{month:'short',day:'numeric'});function clock(){let n=new Date;$('date').textContent=n.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});$('time').textContent=n.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,3e4);async function load(){try{let r=await fetch('/api/study-hq',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);let now=new Date,today=day(now),map=Object.fromEntries(d.courses.map(c=>[c.id,c.code||c.name]));let life=d.lifeTasks.filter(x=>!x.completed&&x.status!=='Done').sort((a,b)=>new Date(a.due||'2999')-new Date(b.due||'2999'));let acad=d.tasks.filter(x=>!x.submitted&&x.status!=='Done').sort((a,b)=>new Date(a.due||'2999')-new Date(b.due||'2999'));let plants=d.plants.filter(x=>x.active!==false),water=plants.filter(x=>x.nextWater&&new Date(x.nextWater)<=new Date(now.toDateString()));let goals=d.goals.filter(x=>x.active!==false&&x.status!=='Complete');$('taskKpi').textContent=life.length;$('uniKpi').textContent=acad.length;$('plantKpi').textContent=plants.length;$('waterKpi').textContent=water.length;$('goalKpi').textContent=goals.length;$('lifeTasks').innerHTML=life.slice(0,7).map(x=>item(x.task,`${x.area||'General'}${x.due?' · '+fmt(x.due):''}${x.priority?' · '+x.priority:''}`)).join('')||empty('No life tasks waiting.');$('deadlines').innerHTML=acad.slice(0,6).map(x=>item(x.task,`${x.course.map(id=>map[id]).filter(Boolean).join(', ')}${x.due?' · '+fmt(x.due):''}`)).join('')||empty('No open university deadlines.');$('plants').innerHTML=plants.length?`<div class="plantGrid">${plants.slice(0,8).map(x=>`<div class="plant"><b>${x.name||'Plant'}</b><div class="meta">${x.species||x.room||'Add plant details'}</div><div class="meta">${x.nextWater?'Water '+fmt(x.nextWater):'Set watering date'} · ${x.health||'Health —'}</div></div>`).join('')}</div>`:empty('Add your first plant in Notion.');$('goals').innerHTML=goals.slice(0,6).map(x=>item(x.name,`${x.area||''}${x.progress!=null?' · '+x.progress+'%':''}${x.nextAction?' · '+x.nextAction:''}`)).join('')||empty('No active goals yet.');let events=[...d.classes.filter(x=>x.when&&day(x.when)===today).map(x=>({n:x.name,m:x.course.map(id=>map[id]).filter(Boolean).join(', ')})),...d.sessions.filter(x=>x.when&&day(x.when)===today).map(x=>({n:x.session,m:x.course.map(id=>map[id]).filter(Boolean).join(', ')})),...life.filter(x=>x.due&&day(x.due)===today).map(x=>({n:x.task,m:x.area}))];$('today').innerHTML=events.map(x=>item(x.n,x.m)).join('')||empty('Nothing scheduled for today.');$('sync').textContent='Live from Notion · '+new Date(d.updatedAt).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});}catch(e){$('sync').textContent=e.message}}load();setInterval(load,12e4);</script></body></html>
