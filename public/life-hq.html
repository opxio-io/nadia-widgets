<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sanctuaire de nadia</title><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#fff;font-family:'Satoshi',-apple-system,sans-serif}.shell{--card:#222;--border:rgba(255,255,255,.07);--muted:rgba(255,255,255,.4);--sub:rgba(255,255,255,.28);--g:#C8FF00;min-height:100vh;padding:20px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.eyebrow,.label{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}h1{font-size:22px;letter-spacing:-.04em;margin:2px 0;font-weight:900}.sync,.meta{font-size:10px;color:var(--sub)}.clock{text-align:right;font-size:10px;color:var(--muted)}.areas{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:10px}.area,.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px}.area .v{font-size:32px;font-weight:900;letter-spacing:-1px;margin-top:9px}.area .s{font-size:10px;color:var(--sub);margin-top:4px}.accent{color:var(--g)}.grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:10px}.wide{grid-column:span 2}.panel{border-bottom:1px solid var(--border);padding-bottom:9px;margin-bottom:5px}.panel h2{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}.item{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;font-weight:600}.item:last-child{border:0}.empty{font-size:11px;color:var(--sub);padding:12px 0}.plantSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:7px}.plantStat{border:1px solid var(--border);border-radius:11px;padding:11px;background:rgba(255,255,255,.025)}.plantStat b{display:block;font-size:20px;letter-spacing:-.04em}.plantStat span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}@media(max-width:900px){.areas{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.shell{padding:10px}.areas{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.clock{display:none}.plantSummary{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="shell"><header class="header"><div><div class="eyebrow">Personal operating system</div><h1>sanctuaire de nadia</h1><div id="sync" class="sync">Connecting to Notion…</div></div><div class="clock"><div id="date"></div><b id="time"></b></div></header><section class="areas"><div class="area"><div class="label">Active courses</div><div id="coursesKpi" class="v accent">—</div><div class="s">degree system</div></div><div class="area"><div class="label">Open coursework</div><div id="workKpi" class="v">—</div><div class="s">assignments + exams</div></div><div class="area"><div class="label">Plants</div><div id="plantKpi" class="v">—</div><div class="s">Society of Green Hall</div></div><div class="area"><div class="label">Water due</div><div id="waterKpi" class="v">—</div><div class="s">today / overdue</div></div><div class="area"><div class="label">Needs attention</div><div id="attentionKpi" class="v">—</div><div class="s">plant health</div></div></section><section class="grid"><article class="card wide"><div class="panel"><h2>Next up</h2></div><div id="next"></div></article><article class="card"><div class="panel"><h2>Plant care</h2></div><div id="plants"></div></article><article class="card"><div class="panel"><h2>University deadlines</h2></div><div id="deadlines"></div></article><article class="card"><div class="panel"><h2>Degree progress</h2></div><div id="degree"></div></article><article class="card"><div class="panel"><h2>Today</h2></div><div id="today"></div></article></section></main><script>const ROSTER_COUNT=17;const $=x=>document.getElementById(x),empty=t=>`<div class="empty">${t}</div>`,item=(a,b)=>`<div class="item">${a}<div class="meta">${b||''}</div></div>`,day=x=>new Date(x).toLocaleDateString('en-CA'),fmt=x=>new Date(x).toLocaleDateString('en-CA',{month:'short',day:'numeric'}),plantSummary=(count,water,attention,live)=>`<div class="plantSummary"><div class="plantStat"><b>${count}</b><span>plants</span></div><div class="plantStat"><b>${live?water:'—'}</b><span>water due</span></div><div class="plantStat"><b>${live?attention:'—'}</b><span>attention</span></div></div>`;function clock(){let n=new Date;$('date').textContent=n.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});$('time').textContent=n.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,3e4);async function load(){try{let r=await fetch('/api/study-hq',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);let now=new Date,today=day(now),map=Object.fromEntries(d.courses.map(c=>[c.id,c.code])),cn=ids=>ids.map(id=>map[id]).filter(Boolean).join(', '),active=d.courses.filter(x=>x.status!=='Completed'),open=d.coursework.filter(x=>x.status!=='Complete').sort((a,b)=>new Date(a.due||'2999')-new Date(b.due||'2999')),livePlants=d.plants||[],count=livePlants.length||ROSTER_COUNT,water=livePlants.filter(x=>x.nextWater&&new Date(x.nextWater)<=new Date(now.toDateString())).length,attention=livePlants.filter(x=>x.health==='Needs Attention').length;$('coursesKpi').textContent=active.length;$('workKpi').textContent=open.length;$('plantKpi').textContent=count;$('waterKpi').textContent=livePlants.length?water:'—';$('attentionKpi').textContent=livePlants.length?attention:'—';$('next').innerHTML=open.filter(x=>x.due).slice(0,7).map(x=>item(x.title,`${cn(x.course)} · ${fmt(x.due)} · ${x.type||'Coursework'}`)).join('')||empty('Nothing urgent is waiting.');$('deadlines').innerHTML=open.filter(x=>x.due).slice(0,6).map(x=>item(x.title,`${cn(x.course)} · ${fmt(x.due)}`)).join('')||empty('No open deadlines.');$('plants').innerHTML=plantSummary(count,water,attention,livePlants.length);$('degree').innerHTML=active.slice(0,6).map(x=>item(x.code||'Course',`${x.subject||''}${x.status?' · '+x.status:''}${x.credits!=null?' · '+x.credits+' cr':''}`)).join('')||empty('No active courses.');let events=d.classes.filter(x=>(x.date&&day(x.date)===today)||(!x.date&&x.days.includes(now.toLocaleDateString('en-CA',{weekday:'long'}))));$('today').innerHTML=events.map(x=>item(x.name||cn(x.course),`${x.time||''}${x.type?' · '+x.type:''}${x.room?' · '+x.room:''}`)).join('')||empty('Nothing scheduled today.');$('sync').textContent='Live from Notion · '+new Date(d.updatedAt).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});}catch(e){$('sync').textContent=e.message;$('plantKpi').textContent=ROSTER_COUNT;$('plants').innerHTML=plantSummary(ROSTER_COUNT,0,0,false)}}load();setInterval(load,12e4);</script></body></html>
